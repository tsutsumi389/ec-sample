<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ホストが data-theme / color-scheme を上書きする前は、この宣言により
     prefers-color-scheme（OS 設定）で light-dark() が解決される。 -->
<meta name="color-scheme" content="light dark">
<title>search_products view</title>
<style>
  /* ---- ホストのテーマ変数 ------------------------------------------------
     spacing（余白）はホストから配られない前提の変数なので、ここでは var() を
     使わずすべて固定値で書く（仕様書 Theming 節: "Spacing intentionally
     excluded"）。色・書体・角丸・影・線幅だけを var(--x, フォールバック) で
     参照し、ホストが値を渡さない場合は light-dark() を使った既定値に落ちる。
     light-dark() の分岐は document.documentElement の color-scheme に従う。
     ここは <meta color-scheme> と、後述の applyDocumentTheme() が両方担当する。 */
  * , *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--color-background-primary, light-dark(#ffffff, #18181b));
    color: var(--color-text-primary, light-dark(#18181b, #f4f4f5));
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
    font-size: var(--font-text-md-size, 15px);
    line-height: 1.6;
  }

  button, select {
    font: inherit;
    color: inherit;
  }

  #app {
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 4px;
  }

  .title {
    margin: 0;
    font-size: var(--font-heading-sm-size, 18px);
    font-weight: var(--font-weight-bold, 700);
    overflow-wrap: anywhere;
  }

  .sort-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .sort-label {
    font-size: var(--font-text-xs-size, 12px);
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
  }

  #sort-select {
    padding: 5px 8px;
    border-radius: var(--border-radius-sm, 6px);
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    background: var(--color-background-secondary, light-dark(#fafafa, #27272a));
  }

  #sort-select:disabled,
  .page-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .note {
    margin: 0;
    font-size: var(--font-text-xs-size, 12px);
    color: var(--color-text-tertiary, light-dark(#71717a, #a1a1aa));
  }

  /* 再検索・リンク開放の失敗は「元の表示に戻せる」ように、既存のグリッドを
     消さずにこのバナーだけを重ねて出す（初回読み込み失敗の全面エラーとは別物）。 */
  .banner-error {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-danger, light-dark(#fef2f2, #450a0a));
    color: var(--color-text-danger, light-dark(#b91c1c, #fca5a5));
    font-size: var(--font-text-sm-size, 13px);
  }

  .banner-error[hidden] { display: none; }

  .text-btn {
    flex: none;
    background: none;
    border: none;
    padding: 2px 4px;
    text-decoration: underline;
    cursor: pointer;
    color: inherit;
  }

  .main { margin-top: 14px; }

  .state-message {
    text-align: center;
    padding: 36px 12px;
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
  }

  .state-message--error {
    color: var(--color-text-danger, light-dark(#b91c1c, #fca5a5));
  }

  .state-message[hidden] { display: none; }

  .retry-btn {
    margin-top: 10px;
    padding: 6px 16px;
    border-radius: var(--border-radius-full, 999px);
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    background: var(--color-background-secondary, light-dark(#fafafa, #27272a));
    cursor: pointer;
  }

  .retry-btn:disabled { opacity: .5; cursor: not-allowed; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
    transition: opacity .15s ease;
  }

  .grid[hidden] { display: none; }
  .grid[data-loading="true"] { opacity: .45; pointer-events: none; }

  .card {
    display: flex;
    flex-direction: column;
    text-align: left;
    background: var(--color-background-secondary, light-dark(#ffffff, #1f1f23));
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    border-radius: var(--border-radius-lg, 14px);
    box-shadow: var(--shadow-sm, 0 1px 2px rgba(0, 0, 0, .08));
    overflow: hidden;
    cursor: pointer;
    padding: 0;
  }

  .card:hover { border-color: var(--color-border-secondary, light-dark(#d4d4d8, #52525b)); }

  .card:focus-visible {
    outline: 2px solid var(--color-ring-primary, light-dark(#3b82f6, #60a5fa));
    outline-offset: 2px;
  }

  .card:disabled { opacity: .6; cursor: default; }

  .card[data-purchasable="false"] .card-availability { font-weight: var(--font-weight-medium, 500); }

  .card-image {
    aspect-ratio: 4 / 3;
    background: var(--color-background-tertiary, light-dark(#f4f4f5, #2a2a2e));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-image .placeholder {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-tertiary, light-dark(#a1a1aa, #71717a));
  }

  .card-body {
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
  }

  .card-category {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-tertiary, light-dark(#71717a, #a1a1aa));
  }

  .card-name {
    font-size: var(--font-text-sm-size, 13px);
    font-weight: var(--font-weight-semibold, 600);
    overflow-wrap: anywhere;
  }

  .card-price-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 2px;
  }

  .card-price {
    font-size: var(--font-text-md-size, 15px);
    font-weight: var(--font-weight-bold, 700);
  }

  .card-list-price {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-tertiary, light-dark(#a1a1aa, #71717a));
    text-decoration: line-through;
  }

  .card-rating {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
  }

  .card-availability {
    margin-top: auto;
    padding-top: 6px;
    font-size: var(--font-text-xs-size, 11px);
  }

  .card-availability[data-ok="true"] {
    color: var(--color-text-success, light-dark(#15803d, #4ade80));
  }

  .card-availability[data-ok="false"] {
    color: var(--color-text-danger, light-dark(#b91c1c, #f87171));
  }

  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
  }

  .pagination[hidden] { display: none; }

  .page-btn {
    padding: 6px 14px;
    border-radius: var(--border-radius-full, 999px);
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    background: var(--color-background-secondary, light-dark(#fafafa, #27272a));
    cursor: pointer;
  }

  .page-indicator {
    font-size: var(--font-text-sm-size, 13px);
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
  }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1 id="result-title" class="title">商品検索</h1>
    <div class="sort-row">
      <label class="sort-label" for="sort-select">並び替え</label>
      <select id="sort-select" disabled>
        <option value="recommended">おすすめ順</option>
        <option value="newest">新着順</option>
        <option value="price_asc">価格が安い順</option>
        <option value="price_desc">価格が高い順</option>
        <option value="rating">評価が高い順</option>
      </select>
    </div>
    <!-- structuredContent.note（価格帯の申し送り、またはカテゴリ不一致の案内）。
         控えめな表示にとどめ、無ければ何も出さない。 -->
    <p id="note" class="note" hidden></p>
  </header>

  <!-- 再検索・商品ページを開く操作の失敗はここに出す。直前まで表示していた
       グリッドはそのまま残す（= 元の表示に戻せる）ので hidden の初期値以外
       このバナーは触らない。 -->
  <div id="refresh-error" class="banner-error" hidden role="alert">
    <span id="refresh-error-text"></span>
    <button id="refresh-error-dismiss" type="button" class="text-btn">閉じる</button>
  </div>

  <main class="main">
    <p id="loading-state" class="state-message">商品を検索しています…</p>

    <!-- 一度も結果を受け取れていない状態（初回の検索そのものが失敗）専用の
         全面エラー。グリッドも並び替えもまだ無いので、ここにだけ再試行を置く。 -->
    <div id="initial-error-state" class="state-message state-message--error" hidden role="alert">
      <p id="initial-error-text"></p>
      <button id="initial-error-retry" type="button" class="retry-btn">再試行</button>
    </div>

    <p id="empty-state" class="state-message" hidden>該当する商品が見つかりませんでした。</p>

    <div id="grid" class="grid" hidden></div>
  </main>

  <footer id="pagination" class="pagination" hidden>
    <button id="prev-btn" class="page-btn" type="button">前へ</button>
    <span id="page-indicator" class="page-indicator"></span>
    <button id="next-btn" class="page-btn" type="button">次へ</button>
  </footer>
</div>
<script type="module">
<!--MCP_APP_SDK-->
// ここから自前の View 実装。上のプレースホルダ行は backend/app/mcp_server/ui_assets.py の
// build_app_html() が vendor バンドル（@modelcontextprotocol/ext-apps の app-with-deps.js を
// 変換したもの）に置き換える。置き換え後、バンドルは `globalThis.__McpAppSdk = {App, ...}`
// という形でグローバルに公開される（fetch-mcp-app-sdk.mjs が末尾の export 文をその形へ
// 機械変換する）。このファイル単体では SDK は存在しないため、node --check のような構文検査
// はできても実行検査はできない（README/CLAUDE.md 参照）。

(() => {
  const sdk = globalThis.__McpAppSdk;
  if (!sdk || typeof sdk.App !== "function") {
    // vendor バンドルが差し込まれていない・壊れているときの保険。ここに来る場合、
    // apps_ui.py 側の設計では本来この HTML 自体が配信されない想定（vendor が無ければ
    // search_products は UI 無しの素のツールとして登録される）。それでも白画面より
    // ましなので、最低限のメッセージだけ出して止める。
    document.body.textContent = "この画面の読み込みに失敗しました。";
    return;
  }
  const { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } = sdk;

  const DEFAULT_SORT = "recommended";
  const DEFAULT_LIMIT = 10;
  const KNOWN_SORTS = ["newest", "price_asc", "price_desc", "rating", "recommended"];
  const BASE_PADDING_PX = 16;

  const els = {
    app: document.getElementById("app"),
    title: document.getElementById("result-title"),
    sortSelect: document.getElementById("sort-select"),
    note: document.getElementById("note"),
    refreshError: document.getElementById("refresh-error"),
    refreshErrorText: document.getElementById("refresh-error-text"),
    refreshErrorDismiss: document.getElementById("refresh-error-dismiss"),
    loadingState: document.getElementById("loading-state"),
    initialErrorState: document.getElementById("initial-error-state"),
    initialErrorText: document.getElementById("initial-error-text"),
    initialErrorRetry: document.getElementById("initial-error-retry"),
    emptyState: document.getElementById("empty-state"),
    grid: document.getElementById("grid"),
    pagination: document.getElementById("pagination"),
    prevBtn: document.getElementById("prev-btn"),
    nextBtn: document.getElementById("next-btn"),
    pageIndicator: document.getElementById("page-indicator"),
  };

  // 再検索では query / category / min_price / max_price はツールの初回引数
  // （ontoolinput で受け取る）から一切変えない。ontoolresult / callServerTool の
  // 戻り値にはこれらが含まれないため、ここが再検索の唯一の土台になる。
  // sort / page / limit は「直近成功した検索」の値（= 画面に実際に出ている内容）を
  // 表す。再検索が失敗しても書き換えない（resetControlsToConfirmed 参照）。
  const state = {
    base: { query: undefined, category: undefined, minPrice: undefined, maxPrice: undefined },
    sort: DEFAULT_SORT,
    page: 1,
    limit: DEFAULT_LIMIT,
    lastGood: null, // 直近成功時の structuredContent（{items,total,page,limit,note}）
    hasResult: false, // 一度でも結果（成功・失敗いずれか）を受け取ったか
    loading: false,
  };

  let app; // 下部で生成する App インスタンス。関数はすべて呼び出し時点の値を見るので、
  // 定義（関数宣言）がこの代入より前に書かれていても問題ない。

  function toArg(value) {
    // 空文字・undefined・null は「指定なし」として引数から落とす。0 は有効な
    // min_price なので落とさない。
    return value === undefined || value === null || value === "" ? undefined : value;
  }

  function formatYen(amount) {
    return "¥" + Number(amount).toLocaleString("ja-JP");
  }

  function setLoading(loading) {
    state.loading = loading;
    els.sortSelect.disabled = loading;
    els.prevBtn.disabled = loading;
    els.nextBtn.disabled = loading;
    els.initialErrorRetry.disabled = loading;
    els.grid.dataset.loading = loading ? "true" : "false";
  }

  // 再検索・リンク開放が失敗したときに、操作系の見た目を「直近成功時」の状態へ
  // 戻す。グリッドの中身自体は触らない（触らないことが「元の表示に戻す」の実体）。
  function resetControlsToConfirmed() {
    els.sortSelect.value = state.sort;
    els.sortSelect.disabled = false;
    els.initialErrorRetry.disabled = false;
    const totalPages = state.lastGood
      ? Math.max(1, Math.ceil(state.lastGood.total / state.lastGood.limit))
      : 1;
    els.prevBtn.disabled = state.page <= 1;
    els.nextBtn.disabled = state.page >= totalPages;
  }

  function renderNote(note) {
    if (note) {
      els.note.textContent = note;
      els.note.hidden = false;
    } else {
      els.note.hidden = true;
      els.note.textContent = "";
    }
  }

  function showRefreshError(message) {
    els.refreshErrorText.textContent = message;
    els.refreshError.hidden = false;
  }

  function hideRefreshError() {
    els.refreshError.hidden = true;
    els.refreshErrorText.textContent = "";
  }

  function showInitialError(message) {
    els.loadingState.hidden = true;
    els.emptyState.hidden = true;
    els.grid.hidden = true;
    els.pagination.hidden = true;
    els.initialErrorText.textContent = message;
    els.initialErrorState.hidden = false;
  }

  function extractStructuredContent(result) {
    return result.structuredContent && typeof result.structuredContent === "object"
      ? result.structuredContent
      : null;
  }

  function extractUiItems(result) {
    // _meta（アンダースコア付き）が CallToolResult の実際のプロパティ名。
    // spec.types.d.ts / app.d.ts のズレを疑って実測したうえでの結論（作業メモ参照）。
    const meta = result._meta;
    const ui = meta && typeof meta === "object" ? meta.ui : undefined;
    return ui && Array.isArray(ui.items) ? ui.items : [];
  }

  function extractErrorMessage(result) {
    // content はモデル向けの文面だが、この画面では読める形の日本語エラー文として
    // そのまま使う（View 側で「買えない理由」のような文言を新たに作文しないのと
    // 同じ理由で、サーバーが用意した文言を優先する）。無ければ汎用文にする。
    if (Array.isArray(result.content)) {
      for (const block of result.content) {
        if (block && block.type === "text" && typeof block.text === "string" && block.text.trim()) {
          return block.text;
        }
      }
    }
    return "検索に失敗しました。もう一度お試しください。";
  }

  function buildCard(item, meta) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.purchasable = String(item.purchasable);

    const imageWrap = document.createElement("div");
    imageWrap.className = "card-image";
    if (meta && meta.image_url) {
      const img = document.createElement("img");
      img.src = meta.image_url;
      // 商品名はこの下に別途テキストで出るので、ここは装飾画像として alt を空にする。
      img.alt = "";
      img.loading = "lazy";
      imageWrap.appendChild(img);
    } else {
      const placeholder = document.createElement("span");
      placeholder.className = "placeholder";
      placeholder.textContent = "画像なし";
      imageWrap.appendChild(placeholder);
    }
    card.appendChild(imageWrap);

    const body = document.createElement("div");
    body.className = "card-body";

    if (item.category) {
      const category = document.createElement("span");
      category.className = "card-category";
      // 商品名・カテゴリ名は未信頼のテキストとして扱い、必ず textContent で入れる。
      category.textContent = item.category;
      body.appendChild(category);
    }

    const name = document.createElement("span");
    name.className = "card-name";
    name.textContent = item.name;
    body.appendChild(name);

    const priceRow = document.createElement("div");
    priceRow.className = "card-price-row";
    const price = document.createElement("span");
    price.className = "card-price";
    price.textContent = formatYen(item.effective_price);
    priceRow.appendChild(price);
    if (item.list_price != null) {
      const listPrice = document.createElement("span");
      listPrice.className = "card-list-price";
      listPrice.textContent = formatYen(item.list_price);
      priceRow.appendChild(listPrice);
    }
    body.appendChild(priceRow);

    const rating = document.createElement("span");
    rating.className = "card-rating";
    rating.textContent = item.avg_rating != null
      ? `★ ${item.avg_rating.toFixed(1)}（${item.review_count}件）`
      : "レビューなし";
    body.appendChild(rating);

    // availability は「購入できます」/ 買えない理由の完成文がサーバーから来る。
    // 理由をここで組み立て直さない（CLAUDE.md の規律をそのまま踏襲）。
    const availability = document.createElement("span");
    availability.className = "card-availability";
    availability.dataset.ok = String(item.purchasable);
    availability.textContent = item.availability;
    body.appendChild(availability);

    card.appendChild(body);

    const pageUrl = meta ? meta.page_url : null;
    card.addEventListener("click", () => openProductPage(pageUrl, card));

    return card;
  }

  async function openProductPage(url, triggerButton) {
    if (!url) return;
    triggerButton.disabled = true;
    try {
      const { isError } = await app.openLink({ url });
      if (isError) {
        showRefreshError("商品ページを開けませんでした。");
      }
    } catch (err) {
      showRefreshError("商品ページを開く操作に失敗しました。");
    } finally {
      triggerButton.disabled = state.loading;
    }
  }

  function renderResult(data, uiItems, requestedSort) {
    state.sort = requestedSort;
    state.page = data.page;
    state.limit = data.limit;
    state.lastGood = data;
    state.hasResult = true;

    els.loadingState.hidden = true;
    els.initialErrorState.hidden = true;

    els.title.textContent = state.base.query
      ? `『${state.base.query}』の検索結果 ${data.total}件`
      : `検索結果 ${data.total}件`;

    renderNote(data.note);

    const metaById = new Map();
    for (const entry of uiItems) {
      if (entry && typeof entry.id !== "undefined") metaById.set(entry.id, entry);
    }

    els.grid.textContent = ""; // innerHTML は使わず子要素を作り直す

    if (data.items.length === 0) {
      els.emptyState.hidden = false;
      els.grid.hidden = true;
      els.pagination.hidden = true;
    } else {
      els.emptyState.hidden = true;
      els.grid.hidden = false;
      for (const item of data.items) {
        els.grid.appendChild(buildCard(item, metaById.get(item.id)));
      }
      const totalPages = Math.max(1, Math.ceil(data.total / data.limit));
      els.pageIndicator.textContent = `${data.page} / ${totalPages} ページ`;
      els.prevBtn.disabled = data.page <= 1;
      els.nextBtn.disabled = data.page >= totalPages;
      els.pagination.hidden = false;
    }

    els.sortSelect.value = state.sort;
    els.sortSelect.disabled = false;
  }

  function handleToolResult(result, requestedSort) {
    setLoading(false);

    if (!result || result.isError) {
      const message = result ? extractErrorMessage(result) : "検索結果を受け取れませんでした。";
      if (state.hasResult) {
        resetControlsToConfirmed();
        showRefreshError(message);
      } else {
        showInitialError(message);
      }
      return;
    }

    const data = extractStructuredContent(result);
    if (!data) {
      const message = "検索結果の形式が不正です。";
      if (state.hasResult) {
        resetControlsToConfirmed();
        showRefreshError(message);
      } else {
        showInitialError(message);
      }
      return;
    }

    hideRefreshError();
    renderResult(data, extractUiItems(result), requestedSort);
  }

  async function doSearch(sortValue, pageValue) {
    if (state.loading) return; // 多重送信を避ける
    hideRefreshError();
    setLoading(true);
    const args = {
      query: toArg(state.base.query),
      category: toArg(state.base.category),
      min_price: toArg(state.base.minPrice),
      max_price: toArg(state.base.maxPrice),
      sort: sortValue,
      page: pageValue,
      limit: state.limit,
    };
    try {
      const result = await app.callServerTool({ name: "search_products", arguments: args });
      handleToolResult(result, sortValue);
    } catch (err) {
      setLoading(false);
      resetControlsToConfirmed();
      const message = "通信エラーが発生しました。もう一度お試しください。";
      if (state.hasResult) {
        showRefreshError(message);
      } else {
        showInitialError(message);
      }
    }
  }

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) applyDocumentTheme(ctx.theme);
    if (ctx.styles && ctx.styles.variables) applyHostStyleVariables(ctx.styles.variables);
    if (ctx.styles && ctx.styles.css && ctx.styles.css.fonts) applyHostFonts(ctx.styles.css.fonts);
    if (ctx.safeAreaInsets) {
      const insets = ctx.safeAreaInsets;
      els.app.style.paddingTop = `${BASE_PADDING_PX + insets.top}px`;
      els.app.style.paddingRight = `${BASE_PADDING_PX + insets.right}px`;
      els.app.style.paddingBottom = `${BASE_PADDING_PX + insets.bottom}px`;
      els.app.style.paddingLeft = `${BASE_PADDING_PX + insets.left}px`;
    }
  }

  // ---- イベント配線 -------------------------------------------------------

  els.sortSelect.addEventListener("change", () => {
    doSearch(els.sortSelect.value, 1); // 並び替えを変えたら 1 ページ目に戻す
  });
  els.prevBtn.addEventListener("click", () => {
    if (state.page > 1) doSearch(state.sort, state.page - 1);
  });
  els.nextBtn.addEventListener("click", () => {
    doSearch(state.sort, state.page + 1);
  });
  els.initialErrorRetry.addEventListener("click", () => {
    doSearch(state.sort, state.page);
  });
  els.refreshErrorDismiss.addEventListener("click", hideRefreshError);

  // ---- App 初期化 ----------------------------------------------------------
  // ハンドラは必ず connect() より前に登録する。tool-input / tool-result /
  // tool-cancelled は一度きりの通知なので、connect() 解決後に登録すると
  // 取りこぼす（SDK 自身が _assertHandlerTiming で警告・例外を出す設計になっている）。

  app = new App({ name: "search-products-view", version: "1.0.0" });

  app.ontoolinput = (params) => {
    const args = (params && params.arguments) || {};
    state.base = {
      query: args.query,
      category: args.category,
      minPrice: args.min_price,
      maxPrice: args.max_price,
    };
    state.sort = KNOWN_SORTS.includes(args.sort) ? args.sort : DEFAULT_SORT;
    state.page = typeof args.page === "number" ? args.page : 1;
    state.limit = typeof args.limit === "number" ? args.limit : DEFAULT_LIMIT;
    els.sortSelect.value = state.sort;
    setLoading(true); // ui/notifications/tool-result が届くまで操作不可にする
  };

  app.ontoolresult = (result) => {
    handleToolResult(result, state.sort);
  };

  app.ontoolcancelled = (params) => {
    setLoading(false);
    const message = params && params.reason
      ? `検索が中断されました（${params.reason}）。`
      : "検索が中断されました。";
    if (state.hasResult) {
      resetControlsToConfirmed();
      showRefreshError(message);
    } else {
      showInitialError(message);
    }
  };

  app.onhostcontextchanged = (ctx) => {
    // このコールバックが呼ばれる時点で、SDK は変更分を内部の hostContext へ
    // マージ済み（onEventDispatch）。テーマ・変数・フォント・safe area は
    // 「差分だけ」渡ってくる可能性があるため、渡ってきたフィールドだけ適用する。
    applyHostContext(ctx);
  };

  app.onerror = (err) => {
    console.error("[search-products view] transport error", err);
  };

  app.connect().then(() => {
    // 初期状態はホストから通知が飛んでこない可能性があるため、connect() 解決後に
    // 手動で一度だけ getHostContext() を読んで適用する（以後の変化は
    // onhostcontextchanged が拾う）。
    applyHostContext(app.getHostContext());
  }).catch((err) => {
    console.error("[search-products view] connect failed", err);
    showInitialError("ホストとの接続に失敗しました。");
  });
})();
</script>
</body>
</html>
