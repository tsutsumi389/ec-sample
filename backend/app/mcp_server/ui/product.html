<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ホストが data-theme / color-scheme を上書きする前は、この宣言により
     prefers-color-scheme（OS 設定）で light-dark() が解決される。 -->
<meta name="color-scheme" content="light dark">
<title>get_product view</title>
<style>
  /* ---- ホストのテーマ変数 ------------------------------------------------
     spacing（余白）はホストから配られない前提の変数なので、ここでは var() を
     使わずすべて固定値で書く（search.html と同じ規約。仕様書 Theming 節:
     "Spacing intentionally excluded"）。色・書体・角丸・影・線幅だけを
     var(--x, フォールバック) で参照し、ホストが値を渡さない場合は light-dark() を
     使った既定値に落ちる。 */
  * , *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--color-background-primary, light-dark(#ffffff, #18181b));
    color: var(--color-text-primary, light-dark(#18181b, #f4f4f5));
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif);
    font-size: var(--font-text-md-size, 15px);
    line-height: 1.6;
  }

  button { font: inherit; color: inherit; }

  #app {
    padding: 16px;
    max-width: 560px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .title {
    margin: 0;
    font-size: var(--font-heading-sm-size, 18px);
    font-weight: var(--font-weight-bold, 700);
    overflow-wrap: anywhere;
  }

  .text-btn {
    flex: none;
    background: none;
    border: none;
    padding: 2px 4px;
    text-decoration: underline;
    cursor: pointer;
    color: inherit;
  }

  .text-btn:disabled { opacity: .5; cursor: not-allowed; }
  .text-btn[hidden] { display: none; }

  /* 再取得・リンク開放の失敗は「元の表示に戻せる」ように、既存のパネルを
     消さずにこのバナーだけを重ねて出す（初回読み込み失敗の全面エラーとは別物。
     search.html と同じ二層構造）。 */
  .banner-error {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: var(--border-radius-sm, 6px);
    background: var(--color-background-danger, light-dark(#fef2f2, #450a0a));
    color: var(--color-text-danger, light-dark(#b91c1c, #fca5a5));
    font-size: var(--font-text-sm-size, 13px);
  }

  .banner-error[hidden] { display: none; }

  .main { margin-top: 14px; }

  .state-message {
    text-align: center;
    padding: 36px 12px;
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
  }

  .state-message--error {
    color: var(--color-text-danger, light-dark(#b91c1c, #fca5a5));
  }

  .state-message[hidden] { display: none; }

  .retry-btn {
    margin-top: 10px;
    padding: 6px 16px;
    border-radius: var(--border-radius-full, 999px);
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    background: var(--color-background-secondary, light-dark(#fafafa, #27272a));
    cursor: pointer;
  }

  .retry-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 商品 1 件を深く見せるパネル。search.html の .card 相当だが、複数件から選ぶ
     ボタンではないので <article> にし、クリックでの遷移は持たせない。 */
  .panel {
    display: flex;
    flex-direction: column;
    background: var(--color-background-secondary, light-dark(#ffffff, #1f1f23));
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    border-radius: var(--border-radius-lg, 14px);
    box-shadow: var(--shadow-sm, 0 1px 2px rgba(0, 0, 0, .08));
    overflow: hidden;
  }

  .panel[hidden] { display: none; }

  .panel-image {
    aspect-ratio: 4 / 3;
    background: var(--color-background-tertiary, light-dark(#f4f4f5, #2a2a2e));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .panel-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .panel-image .placeholder {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-tertiary, light-dark(#a1a1aa, #71717a));
  }

  .panel-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .panel-category {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-tertiary, light-dark(#71717a, #a1a1aa));
  }

  .panel-category[hidden] { display: none; }

  .panel-name {
    margin: 0;
    font-size: var(--font-heading-sm-size, 18px);
    font-weight: var(--font-weight-semibold, 600);
    overflow-wrap: anywhere;
  }

  .panel-sku {
    font-size: var(--font-text-xs-size, 11px);
    color: var(--color-text-tertiary, light-dark(#71717a, #a1a1aa));
  }

  .panel-sku[hidden] { display: none; }

  .panel-price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 4px;
  }

  .panel-price {
    /* 価格だけは商品名（--font-heading-sm-size）より一段大きく見せたいが、固定 px で
       書くとホストが配るフォントサイズ変数（applyHostStyleVariables）に追随せず、
       文字を拡大している利用者の画面でここだけ取り残される。倍率で持たせて、
       他の宣言と同じく必ずホスト変数を経由させる。 */
    font-size: calc(var(--font-heading-sm-size, 18px) * 1.22);
    font-weight: var(--font-weight-bold, 700);
  }

  .panel-list-price {
    font-size: var(--font-text-sm-size, 13px);
    color: var(--color-text-tertiary, light-dark(#a1a1aa, #71717a));
    text-decoration: line-through;
  }

  .panel-list-price[hidden] { display: none; }

  .panel-rating {
    font-size: var(--font-text-sm-size, 13px);
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
  }

  /* availability は「購入できます」/ 買えない理由の完成文がサーバーから来る
     （services/cart.py の availability_reason_for_status が唯一の源）。
     ここでは色分けの表示だけを持ち、文言は自作しない。 */
  .panel-availability {
    font-size: var(--font-text-sm-size, 13px);
    font-weight: var(--font-weight-medium, 500);
  }

  .panel-availability[data-ok="true"] {
    color: var(--color-text-success, light-dark(#15803d, #4ade80));
  }

  .panel-availability[data-ok="false"] {
    color: var(--color-text-danger, light-dark(#b91c1c, #f87171));
  }

  .panel-description {
    margin: 6px 0 0;
    font-size: var(--font-text-sm-size, 13px);
    color: var(--color-text-primary, light-dark(#18181b, #f4f4f5));
    /* description は改行を含みうる自由文。innerHTML は使わないので、改行の見た目は
       textContent のままここで pre-wrap にして表現する。 */
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .panel-description[hidden] { display: none; }

  .specs-heading {
    margin: 10px 0 4px;
    font-size: var(--font-text-sm-size, 13px);
    font-weight: var(--font-weight-semibold, 600);
  }

  /* specs は "ラベル: 値" に潰した文字列の配列（views.ProductDetail.specs）。
     label/value に分割しての表形式にはしない——CLAUDE.md の「label/value の
     2キーを増やさない」規律に、表示側も倣う。 */
  .spec-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .spec-item {
    font-size: var(--font-text-sm-size, 13px);
    color: var(--color-text-secondary, light-dark(#52525b, #d4d4d8));
    padding: 6px 0;
    border-top: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#f4f4f5, #2a2a2e));
    overflow-wrap: anywhere;
  }

  .spec-item:first-child { border-top: none; }

  .panel-actions { margin-top: 12px; }

  .page-btn {
    padding: 8px 16px;
    border-radius: var(--border-radius-full, 999px);
    border: var(--border-width-regular, 1px) solid var(--color-border-primary, light-dark(#e4e4e7, #3f3f46));
    background: var(--color-background-secondary, light-dark(#fafafa, #27272a));
    cursor: pointer;
  }

  .page-btn[hidden] { display: none; }
  .page-btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1 id="result-title" class="title">商品詳細</h1>
    <!-- 直近成功時の product_id で get_product を呼び直すボタン。並び替え・
         ページングが無い分、search.html より状態は単純（読み込み中／表示／
         エラーの3状態）。 -->
    <button id="reload-btn" type="button" class="text-btn" hidden>再読み込み</button>
  </header>

  <!-- 再取得・商品ページを開く操作の失敗はここに出す。直前まで表示していた
       パネルはそのまま残す（= 元の表示に戻せる）ので hidden の初期値以外
       このバナーは触らない。 -->
  <div id="refresh-error" class="banner-error" hidden role="alert">
    <span id="refresh-error-text"></span>
    <button id="refresh-error-dismiss" type="button" class="text-btn">閉じる</button>
  </div>

  <main class="main">
    <p id="loading-state" class="state-message">商品情報を取得しています…</p>

    <!-- 一度も結果を受け取れていない状態（初回の取得そのものが失敗、または
         商品が存在しない）専用の全面エラー。get_product は「0件」を返す概念が
         無く、存在しない product_id はここに落ちる（search.html の
         empty-state に相当するものはこちら1本に集約する）。 -->
    <div id="initial-error-state" class="state-message state-message--error" hidden role="alert">
      <p id="initial-error-text"></p>
      <button id="initial-error-retry" type="button" class="retry-btn">再試行</button>
    </div>

    <article id="panel" class="panel" hidden>
      <div id="panel-image" class="panel-image"></div>
      <div class="panel-body">
        <span id="panel-category" class="panel-category" hidden></span>
        <h2 id="panel-name" class="panel-name"></h2>
        <span id="panel-sku" class="panel-sku" hidden></span>

        <div class="panel-price-row">
          <span id="panel-price" class="panel-price"></span>
          <span id="panel-list-price" class="panel-list-price" hidden></span>
        </div>

        <span id="panel-rating" class="panel-rating"></span>

        <span id="panel-availability" class="panel-availability"></span>

        <p id="panel-description" class="panel-description" hidden></p>

        <div id="panel-specs-wrap" hidden>
          <h3 class="specs-heading">仕様</h3>
          <ul id="panel-specs" class="spec-list"></ul>
        </div>

        <div class="panel-actions">
          <button id="open-page-btn" type="button" class="page-btn" hidden>商品ページを見る</button>
        </div>
      </div>
    </article>
  </main>
</div>
<script type="module">
<!--MCP_APP_SDK-->
// ここから自前の View 実装。上のプレースホルダ行は backend/app/mcp_server/ui_assets.py の
// build_app_html() が vendor バンドルに置き換える（search.html と同じ仕組み。詳細は
// search.html のコメント参照）。

(() => {
  const sdk = globalThis.__McpAppSdk;
  if (!sdk || typeof sdk.App !== "function") {
    // vendor バンドルが差し込まれていない・壊れているときの保険。search.html と同じ
    // 理由でここに来る想定は薄いが、白画面よりましなので最低限のメッセージだけ出す。
    document.body.textContent = "この画面の読み込みに失敗しました。";
    return;
  }
  const { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } = sdk;

  const BASE_PADDING_PX = 16;

  const els = {
    app: document.getElementById("app"),
    title: document.getElementById("result-title"),
    reloadBtn: document.getElementById("reload-btn"),
    refreshError: document.getElementById("refresh-error"),
    refreshErrorText: document.getElementById("refresh-error-text"),
    refreshErrorDismiss: document.getElementById("refresh-error-dismiss"),
    loadingState: document.getElementById("loading-state"),
    initialErrorState: document.getElementById("initial-error-state"),
    initialErrorText: document.getElementById("initial-error-text"),
    initialErrorRetry: document.getElementById("initial-error-retry"),
    panel: document.getElementById("panel"),
    panelImage: document.getElementById("panel-image"),
    panelCategory: document.getElementById("panel-category"),
    panelName: document.getElementById("panel-name"),
    panelSku: document.getElementById("panel-sku"),
    panelPrice: document.getElementById("panel-price"),
    panelListPrice: document.getElementById("panel-list-price"),
    panelRating: document.getElementById("panel-rating"),
    panelAvailability: document.getElementById("panel-availability"),
    panelDescription: document.getElementById("panel-description"),
    panelSpecsWrap: document.getElementById("panel-specs-wrap"),
    panelSpecs: document.getElementById("panel-specs"),
    openPageBtn: document.getElementById("open-page-btn"),
  };

  // 再取得では product_id をツールの初回引数（ontoolinput で受け取る）から一切
  // 変えない。ontoolresult / callServerTool の戻り値には product_id が含まれない
  // ため、ここが「再試行」「再読み込み」双方の唯一の土台になる（search.html の
  // state.base と同じ役割）。
  const state = {
    productId: null,
    hasResult: false, // 一度でも結果（成功・失敗いずれか）を受け取ったか
    loading: false,
    pageUrl: null, // 直近成功時の _meta.ui.page_url（商品ページを開くボタン用）
  };

  let app; // 下部で生成する App インスタンス。関数はすべて呼び出し時点の値を見るので、
  // 定義（関数宣言）がこの代入より前に書かれていても問題ない。

  function formatYen(amount) {
    return "¥" + Number(amount).toLocaleString("ja-JP");
  }

  function setLoading(loading) {
    state.loading = loading;
    els.initialErrorRetry.disabled = loading;
    els.reloadBtn.disabled = loading;
    els.openPageBtn.disabled = loading;
  }

  // 再取得・リンク開放が失敗したときに、操作系の見た目を「直近成功時」の状態へ
  // 戻す。パネルの中身自体は触らない（触らないことが「元の表示に戻す」の実体。
  // search.html の resetControlsToConfirmed と同じ考え方）。
  function resetControlsToConfirmed() {
    els.initialErrorRetry.disabled = false;
    els.reloadBtn.disabled = false;
    els.openPageBtn.disabled = false;
  }

  function showRefreshError(message) {
    els.refreshErrorText.textContent = message;
    els.refreshError.hidden = false;
  }

  function hideRefreshError() {
    els.refreshError.hidden = true;
    els.refreshErrorText.textContent = "";
  }

  function showInitialError(message) {
    els.loadingState.hidden = true;
    els.panel.hidden = true;
    els.reloadBtn.hidden = true;
    els.initialErrorText.textContent = message;
    els.initialErrorState.hidden = false;
  }

  function extractStructuredContent(result) {
    return result.structuredContent && typeof result.structuredContent === "object"
      ? result.structuredContent
      : null;
  }

  function extractUiMeta(result) {
    // _meta（アンダースコア付き）が CallToolResult の実際のプロパティ名
    // （search.html で実測済みの結論をそのまま踏襲）。商品詳細は1件だけなので、
    // search.html のような id による Map 突き合わせは要らず、_meta.ui を
    // そのままオブジェクトとして読む。
    const meta = result._meta;
    const ui = meta && typeof meta === "object" ? meta.ui : undefined;
    return ui && typeof ui === "object" ? ui : null;
  }

  function extractErrorMessage(result) {
    // content はモデル向けの文面だが、この画面では読める形の日本語エラー文として
    // そのまま使う。get_product が存在しない product_id で返す "Product not found"
    // は英語のまま素通しされる（errors.py の docstring 参照）ので、決め打ちの
    // 日本語に翻訳し直さずサーバーの文言を優先する。
    if (Array.isArray(result.content)) {
      for (const block of result.content) {
        if (block && block.type === "text" && typeof block.text === "string" && block.text.trim()) {
          return block.text;
        }
      }
    }
    return "商品情報を取得できませんでした。";
  }

  function renderPanel(data, meta) {
    state.hasResult = true;
    state.pageUrl = meta ? meta.page_url : null;

    els.loadingState.hidden = true;
    els.initialErrorState.hidden = true;

    els.title.textContent = data.name;

    els.panelImage.textContent = ""; // innerHTML は使わず子要素を作り直す
    if (meta && meta.image_url) {
      const img = document.createElement("img");
      img.src = meta.image_url;
      // 商品名は下に別途テキストで出るので、ここは装飾画像として alt を空にする。
      img.alt = "";
      img.loading = "lazy";
      els.panelImage.appendChild(img);
    } else {
      const placeholder = document.createElement("span");
      placeholder.className = "placeholder";
      placeholder.textContent = "画像なし";
      els.panelImage.appendChild(placeholder);
    }

    // 商品名・カテゴリ名・説明・仕様は未信頼のテキストとして扱い、必ず
    // textContent で入れる（search.html と同じ規律）。
    if (data.category) {
      els.panelCategory.textContent = data.category;
      els.panelCategory.hidden = false;
    } else {
      els.panelCategory.hidden = true;
      els.panelCategory.textContent = "";
    }

    els.panelName.textContent = data.name;

    if (data.sku) {
      els.panelSku.textContent = `商品コード: ${data.sku}`;
      els.panelSku.hidden = false;
    } else {
      els.panelSku.hidden = true;
      els.panelSku.textContent = "";
    }

    els.panelPrice.textContent = formatYen(data.effective_price);
    if (data.list_price != null) {
      els.panelListPrice.textContent = formatYen(data.list_price);
      els.panelListPrice.hidden = false;
    } else {
      els.panelListPrice.hidden = true;
      els.panelListPrice.textContent = "";
    }

    els.panelRating.textContent = data.avg_rating != null
      ? `★ ${data.avg_rating.toFixed(1)}（${data.review_count}件）`
      : "レビューなし";

    els.panelAvailability.dataset.ok = String(data.purchasable);
    els.panelAvailability.textContent = data.availability;

    if (data.description) {
      els.panelDescription.textContent = data.description;
      els.panelDescription.hidden = false;
    } else {
      els.panelDescription.hidden = true;
      els.panelDescription.textContent = "";
    }

    els.panelSpecs.textContent = ""; // innerHTML は使わず子要素を作り直す
    if (Array.isArray(data.specs) && data.specs.length > 0) {
      for (const spec of data.specs) {
        const li = document.createElement("li");
        li.className = "spec-item";
        li.textContent = spec;
        els.panelSpecs.appendChild(li);
      }
      els.panelSpecsWrap.hidden = false;
    } else {
      els.panelSpecsWrap.hidden = true;
    }

    if (state.pageUrl) {
      els.openPageBtn.hidden = false;
      els.openPageBtn.disabled = state.loading;
    } else {
      els.openPageBtn.hidden = true;
    }

    els.reloadBtn.hidden = false;
    els.reloadBtn.disabled = state.loading;

    els.panel.hidden = false;
  }

  function handleToolResult(result) {
    setLoading(false);

    if (!result || result.isError) {
      const message = result ? extractErrorMessage(result) : "商品情報を受け取れませんでした。";
      if (state.hasResult) {
        resetControlsToConfirmed();
        showRefreshError(message);
      } else {
        showInitialError(message);
      }
      return;
    }

    const data = extractStructuredContent(result);
    if (!data) {
      const message = "商品情報の形式が不正です。";
      if (state.hasResult) {
        resetControlsToConfirmed();
        showRefreshError(message);
      } else {
        showInitialError(message);
      }
      return;
    }

    hideRefreshError();
    renderPanel(data, extractUiMeta(result));
  }

  async function fetchProduct() {
    if (state.loading) return; // 多重送信を避ける
    if (state.productId == null) {
      showInitialError("商品IDを受け取れませんでした。");
      return;
    }
    hideRefreshError();
    setLoading(true);
    try {
      const result = await app.callServerTool({
        name: "get_product",
        arguments: { product_id: state.productId },
      });
      handleToolResult(result);
    } catch (err) {
      setLoading(false);
      resetControlsToConfirmed();
      const message = "通信エラーが発生しました。もう一度お試しください。";
      if (state.hasResult) {
        showRefreshError(message);
      } else {
        showInitialError(message);
      }
    }
  }

  async function openProductPage() {
    const url = state.pageUrl;
    if (!url) return;
    els.openPageBtn.disabled = true;
    try {
      const { isError } = await app.openLink({ url });
      if (isError) {
        showRefreshError("商品ページを開けませんでした。");
      }
    } catch (err) {
      showRefreshError("商品ページを開く操作に失敗しました。");
    } finally {
      els.openPageBtn.disabled = state.loading;
    }
  }

  function applyHostContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) applyDocumentTheme(ctx.theme);
    if (ctx.styles && ctx.styles.variables) applyHostStyleVariables(ctx.styles.variables);
    if (ctx.styles && ctx.styles.css && ctx.styles.css.fonts) applyHostFonts(ctx.styles.css.fonts);
    if (ctx.safeAreaInsets) {
      const insets = ctx.safeAreaInsets;
      els.app.style.paddingTop = `${BASE_PADDING_PX + insets.top}px`;
      els.app.style.paddingRight = `${BASE_PADDING_PX + insets.right}px`;
      els.app.style.paddingBottom = `${BASE_PADDING_PX + insets.bottom}px`;
      els.app.style.paddingLeft = `${BASE_PADDING_PX + insets.left}px`;
    }
  }

  // ---- イベント配線 -------------------------------------------------------

  els.initialErrorRetry.addEventListener("click", fetchProduct);
  els.reloadBtn.addEventListener("click", fetchProduct);
  els.refreshErrorDismiss.addEventListener("click", hideRefreshError);
  els.openPageBtn.addEventListener("click", openProductPage);

  // ---- App 初期化 ----------------------------------------------------------
  // ハンドラは必ず connect() より前に登録する。tool-input / tool-result /
  // tool-cancelled は一度きりの通知なので、connect() 解決後に登録すると取りこぼす
  // （search.html と同じ理由）。

  app = new App({ name: "product-detail-view", version: "1.0.0" });

  app.ontoolinput = (params) => {
    const args = (params && params.arguments) || {};
    state.productId = typeof args.product_id === "number" ? args.product_id : null;
    setLoading(true); // ui/notifications/tool-result が届くまで操作不可にする
  };

  app.ontoolresult = (result) => {
    handleToolResult(result);
  };

  app.ontoolcancelled = (params) => {
    setLoading(false);
    const message = params && params.reason
      ? `取得が中断されました（${params.reason}）。`
      : "取得が中断されました。";
    if (state.hasResult) {
      resetControlsToConfirmed();
      showRefreshError(message);
    } else {
      showInitialError(message);
    }
  };

  app.onhostcontextchanged = (ctx) => {
    // 「差分だけ渡ってくる可能性がある」ため、渡ってきたフィールドだけ適用する
    // （search.html と同じ）。
    applyHostContext(ctx);
  };

  app.onerror = (err) => {
    console.error("[product-detail view] transport error", err);
  };

  app.connect().then(() => {
    // 初期状態はホストから通知が飛んでこない可能性があるため、connect() 解決後に
    // 手動で一度だけ getHostContext() を読んで適用する（以後の変化は
    // onhostcontextchanged が拾う）。
    applyHostContext(app.getHostContext());
  }).catch((err) => {
    console.error("[product-detail view] connect failed", err);
    showInitialError("ホストとの接続に失敗しました。");
  });
})();
</script>
</body>
</html>
