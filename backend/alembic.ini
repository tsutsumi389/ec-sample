# Alembic の設定。接続先（sqlalchemy.url）はここに書かない。
# DATABASE_URL を唯一の源とし、alembic/env.py が app.database から取り込む。

[alembic]
script_location = alembic
prepend_sys_path = .

# マイグレーションファイル名。リビジョンIDだけだと何の変更か分からないため
# メッセージのスラッグを付ける（例: 0001_baseline_schema.py）。
file_template = %%(rev)s_%%(slug)s

# タイムゾーン付きの日時をリビジョンヘッダに書く。
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
