<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ホストが data-theme / color-scheme を上書きする前は、この宣言により
     prefers-color-scheme（OS 設定）で light-dark() が解決される。
     **消さないこと。** 消すとホストからテーマが届くまでの一瞬、light-dark() が
     常に明側へ倒れる。 -->
<meta name="color-scheme" content="light dark">
<title>search_products view</title>
<!-- スタイルはここに直書きせず src/search/main.tsx が import する
     （shared/theme.css → search.css の順。この順がそのままカスケードの順になる）。
     ビルド時に vite-plugin-singlefile が1枚にまとめて head へ差し込む。 -->
</head>
<body>
<!-- **画面の中身は React（src/search/SearchView.tsx）が組む。**
     ここに骨組みを書き戻さないこと——createRoot().render() はこの器の中身を
     必ず作り直すので、静的に置いた要素は一瞬だけ見えて消える（描画の二重化）。
     ホストの safe area を受ける #app も SearchView が描く（shared/host.ts の
     useSafeAreaInsets がその要素へ --safe-area-* を載せる）。 -->
<div id="root"></div>
<!-- src からの絶対パス（root は mcp-apps/）。**このファイルは mcp-apps/ の直下から
     動かさないこと**——Vite は root からの相対パスをそのまま outDir 内のパスにするので、
     src/ の下へ移すと dist/src/search.html に出て、backend の ui_assets.py が読む
     dist/search.html が生えなくなる。 -->
<script type="module" src="/src/search/main.tsx"></script>
</body>
</html>
