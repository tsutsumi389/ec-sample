<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ホストが data-theme / color-scheme を上書きする前は、この宣言により
     prefers-color-scheme（OS 設定）で light-dark() が解決される。
     **消さないこと**——消すと最初の一瞬の描画が常に light 側に倒れる。 -->
<meta name="color-scheme" content="light dark">
<title>get_product view</title>
<!-- スタイルはここに直書きせず src/product/main.tsx が import する
     （shared/theme.css → product.css の順。この順がそのままカスケードの順になる）。
     ビルドで vite-plugin-singlefile が1枚の style 要素にまとめて差し込むので、
     出来上がった dist/product.html は外部参照を1つも持たない。 -->
</head>
<body>
<!-- **画面の中身は React（src/product/ProductView.tsx）が組む。**
     ここに骨組みを書き戻さないこと——createRoot().render() はこの器の中身を
     必ず作り直すので、静的に置いた要素は一瞬だけ見えて消える（描画の二重化）。
     ホストの safe area を受ける #app も ProductView が描く（shared/host.ts の
     useSafeAreaInsets がその要素へ --safe-area-* を載せる）。 -->
<div id="root"></div>
<!-- root（mcp-apps/）からの絶対パスで参照する。ビルド後はこの1行が
     インライン化された JS + CSS に置き換わる。 -->
<script type="module" src="/src/product/main.tsx"></script>
</body>
</html>
